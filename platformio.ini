; Maintainer-only PlatformIO project file for ConnectionLib itself.
; Drives `pio test` for the hardware-free core types (Address, DutyCycleGuard).
; Consumers of the library do NOT use this file — they add ConnectionLib as a
; lib_dep in their own project, or build one of the examples/ directly, each of
; which has its own platformio.ini.

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
lib_deps =
    symlink://.
    throwtheswitch/Unity@^2.6.1
