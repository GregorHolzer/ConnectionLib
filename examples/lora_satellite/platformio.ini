[env:ttgo-t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
build_unflags = -std=gnu++11
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
    symlink://../..
    jgromes/RadioLib@^6
; The two -I flags below work around a PlatformIO LDF limitation observed with this
; toolchain/RadioLib combo: RadioLib.h isn't found when it's #include'd from inside another
; library (ConnectionLib) rather than this project's own src/, and RadioLib's own sources (which
; declare `"libLDFMode": "chain+"` in their manifest) fail to resolve the framework's bundled
; SPI.h for themselves. Without these, the build fails with "fatal error: RadioLib.h/SPI.h: No
; such file or directory" despite both libraries being correctly installed.
build_flags =
    -std=gnu++17
    -I.pio/libdeps/$PIOENV/RadioLib/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src
